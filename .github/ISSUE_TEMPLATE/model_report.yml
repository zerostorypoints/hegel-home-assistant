name: Works with my model
description: Tell us whether the integration works with your Hegel amplifier
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Amplifier model and firmware
      placeholder: H190, 1205.1011
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Discovery
        - label: Power on / standby
        - label: Volume and mute
        - label: Input selection
        - label: Playback and now playing
        - label: Stream format sensors
  - type: textarea
    id: notes
    attributes:
      label: Notes
