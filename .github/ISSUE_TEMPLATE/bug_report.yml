name: Bug report
description: Something does not work with your amplifier
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: Amplifier model and firmware
      description: Firmware is shown on the device page in Home Assistant.
      placeholder: H400, 1205.1011
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and debug log
      description: Device page → Download diagnostics. Attach the file or paste the relevant part.
